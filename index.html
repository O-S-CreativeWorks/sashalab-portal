<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>SashaLab ERP — O&S CreativeWorks</title>
<style>
:root{
  --bg:#0f1115;--bg-2:#151922;--bg-3:#1c2230;--surface:#1e2533;--surface-2:#252e40;
  --border:#2c3446;--text:#e8ecf4;--text-dim:#98a2b8;--text-muted:#667085;
  --brand:#6c5ce7;--brand-2:#8b7cf0;--brand-soft:rgba(108,92,231,.15);
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --radius:12px;--radius-sm:8px;--shadow:0 8px 28px rgba(0,0,0,.35);
  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
[data-theme="light"]{
  --bg:#f5f6fa;--bg-2:#ffffff;--bg-3:#eef0f6;--surface:#ffffff;--surface-2:#f0f2f8;
  --border:#d8dce6;--text:#1a1d26;--text-dim:#5a6273;--text-muted:#8890a3;
  --brand:#6c5ce7;--brand-2:#5a4ad1;--brand-soft:rgba(108,92,231,.1);
  --ok:#16a34a;--warn:#d97706;--danger:#dc2626;--info:#2563eb;
  --shadow:0 8px 28px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand-2);text-decoration:none}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s ease}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand h1 span{color:var(--brand-2)}
.brand p{font-size:11px;color:var(--text-muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-dim);font-weight:500;font-size:13.5px;margin-bottom:2px;transition:all .15s}
.nav a:hover{background:var(--bg-3);color:var(--text)}
.nav a.active{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav .group-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);padding:14px 12px 6px;font-weight:700}
.nav .badge-count{display:inline-block;margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:700}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.topbar h2{font-size:16px;font-weight:600}
.topbar .actions{display:flex;gap:8px;align-items:center}
.menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text)}
.content{padding:24px;overflow-y:auto;flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fca5a5}
[data-theme="light"] .btn-danger{background:rgba(220,38,38,.08);color:var(--danger)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-icon{padding:8px;width:34px;height:34px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card + .card{margin-top:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text)}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.full{grid-template-columns:1fr}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--text-dim);letter-spacing:.3px}
.field input,.field select,.field textarea{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);transition:border-color .15s;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:11px;color:var(--text-muted)}
.field.error input,.field.error select,.field.error textarea{border-color:var(--danger)}
.field .err-msg{font-size:11px;color:#fca5a5;display:none}
.field.error .err-msg{display:block}

.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);font-weight:700}
.table tbody tr:hover{background:var(--bg-3)}
.table td.actions{text-align:right;white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge.ok{background:rgba(34,197,94,.15);color:#4ade80}
.badge.warn{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.danger{background:rgba(239,68,68,.15);color:#f87171}
.badge.info{background:rgba(59,130,246,.15);color:#93c5fd}
.badge.muted{background:var(--bg-3);color:var(--text-dim)}
[data-theme="light"] .badge.ok{background:rgba(22,163,74,.12);color:#15803d}
[data-theme="light"] .badge.warn{background:rgba(217,119,6,.12);color:#b45309}
[data-theme="light"] .badge.danger{background:rgba(220,38,38,.12);color:#b91c1c}
[data-theme="light"] .badge.info{background:rgba(37,99,235,.12);color:#1d4ed8}

.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:.5}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);animation:slideUp .2s ease}
.modal.lg{max-width:860px}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:22px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-dim);cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:var(--text)}

.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--brand);padding:12px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13px;min-width:240px;animation:slideIn .2s ease}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.danger{border-left-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters .field{margin:0;min-width:160px}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pill-tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:12.5px;font-weight:500}
.pill-tabs button.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2)}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);font-weight:700}
.stat .value{font-size:26px;font-weight:700;line-height:1.1}
.stat .value.brand{color:var(--brand-2)}
.stat .sub{font-size:11px;color:var(--text-muted)}

.alert-list{display:flex;flex-direction:column;gap:10px}
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--bg-3);border-radius:var(--radius-sm);border-left:3px solid var(--warn)}
.alert-item.danger{border-left-color:var(--danger)}
.alert-item.info{border-left-color:var(--info)}
.alert-item .a-content{flex:1}
.alert-item .a-title{font-weight:600;font-size:13px;margin-bottom:3px}
.alert-item .a-desc{font-size:12px;color:var(--text-dim)}

.recorder{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg-3);border-radius:var(--radius-sm);border:1px solid var(--border);flex-wrap:wrap}
.recorder .dot{width:10px;height:10px;border-radius:50%;background:var(--text-muted)}
.recorder.recording .dot{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.recorder audio{height:34px;flex:1;min-width:180px}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px;padding:12px 14px;background:var(--bg-3);border-radius:var(--radius-sm);border:1px solid var(--border)}
.timeline-item::before{content:"";position:absolute;left:-22px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--bg-2)}
.timeline-item .meta{font-size:11px;color:var(--text-muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.timeline-item .text{font-size:13px;white-space:pre-wrap}
.timeline-item .del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0}
.timeline-item .del:hover{color:var(--danger)}

.working-hours-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wh-day{padding:8px;background:var(--bg-3);border-radius:6px;font-size:11px;text-align:center}
.wh-day.open{border:1px solid var(--ok);background:rgba(34,197,94,.1)}
.wh-day.closed{opacity:.5}
.wh-day strong{display:block;margin-bottom:4px}

@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;inset:0;margin:0;padding:0;background:#fff;color:#000}
  @page{margin:12mm}
}

@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:260px;z-index:50;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .menu-toggle{display:block}
  .content{padding:16px}
  .topbar{padding:0 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>O&S <span>CreativeWorks</span></h1>
      <p>SashaLab · Guitar School ERP</p>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard"><span class="ic">◈</span>Dashboard</a>
      <div class="group-label">Správa</div>
      <a href="#/students" data-route="students"><span class="ic">◉</span>Studenti</a>
      <a href="#/schedule" data-route="schedule"><span class="ic">⟳</span>Rozvrh <span class="badge-count" id="navSchedule"></span></a>
      <a href="#/lessons" data-route="lessons"><span class="ic">◷</span>Docházka</a>
      <a href="#/homework" data-route="homework"><span class="ic">✎</span>Domácí úkoly</a>
      <a href="#/certificates" data-route="certificates"><span class="ic">★</span>Certifikáty</a>
      <div class="group-label">Finance</div>
      <a href="#/invoices" data-route="invoices"><span class="ic">▤</span>Fakturace</a>
      <a href="#/packages" data-route="packages"><span class="ic">▦</span>Balíčky</a>
      <a href="#/pricing" data-route="pricing"><span class="ic">◎</span>Ceník</a>
      <div class="group-label">Rozšíření</div>
      <a href="#/printing3d" data-route="printing3d"><span class="ic">⬢</span>3D tisk</a>

  <div class="main">

      <div class="actions">
        <button class="btn btn-sm btn-icon" id="btnTheme" title="Přepnout světlý/tmavý režim">🌙</button>

        <button class="btn btn-primary btn-sm" id="btnQuickAdd">+ Nový student</button>

    <div class="content" id="app"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Titulek</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. UTILITIES
   ============================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "dataset") Object.assign(node.dataset, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return node;
};

const uid = (prefix = "id") => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
const fmtCZK = (n) => new Intl.NumberFormat("cs-CZ", { style: "currency", currency: "CZK" }).format(Number(n) || 0);
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("cs-CZ") : "—";
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("cs-CZ") : "—";
const todayISO = () => new Date().toISOString().slice(0, 10);

function calcAge(dateISO) {
  if (!dateISO) return null;
  const d = new Date(dateISO);
  if (isNaN(d)) return null;
  const t = new Date();
  let age = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
  return age;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function downloadBlob(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toCSV(rows) {
  if (!rows.length) return "";
  const headers = Object.keys(rows[0]);
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [headers.map(esc).join(","), ...rows.map((r) => headers.map((h) => esc(r[h])).join(","))].join("\r\n");
}

/* Datum helpers */
function addDays(dateISO, days) {
  const d = new Date(dateISO);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function getWeekday(dateISO) {
  return new Date(dateISO).getDay(); // 0=Ne, 1=Po, ..., 6=So
}
function fmtDateShort(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("cs-CZ", { weekday: "short", day: "numeric", month: "numeric" });
}

/* ============================================================
   2. STORE (localStorage) – verze 3 (hardcore)
   ============================================================ */
const STORE_KEY = "sashalab_erp_v1";
const SCHEMA_VERSION = 3;

const defaultState = () => ({
  version: SCHEMA_VERSION,
  theme: "dark",
  settings: {
    companyName: "O&S CreativeWorks — SashaLab",
    ico: "",
    address: "Jungmannova 871/16, Kuřim 664 34",
    bankAccount: "",
    iban: "",
    vatPayer: false,
    lectorName: "Oleksandr Kukushkin",
    lectorEmail: "",
    lectorPhone: "",
    invoiceCounter: 1,
    invoicePrefix: "SL",
    // Pracovní doba (0=Ne, 1=Po, ..., 6=So)
    workingHours: {
      1: { open: true, from: "15:00", to: "20:00" }, // Po
      2: { open: true, from: "15:30", to: "20:00" }, // Út
      3: { open: true, from: "18:00", to: "20:00" }, // St
      4: { open: false, from: "", to: "" },          // Čt
      5: { open: false, from: "", to: "" },          // Pá
      6: { open: true, from: "12:00", to: "20:00" }, // So
      0: { open: false, from: "", to: "" },          // Ne
    },
  },
  students: [],
  lessons: [],
  homeworks: [],
  invoices: [],
  pricing: [
    { id: "p_lesson_60", name: "Individuální lekce 60 min", price: 450 },
    { id: "p_lesson_45", name: "Individuální lekce 45 min", price: 350 },
    { id: "p_online", name: "Online lekce 60 min", price: 400 },
    { id: "p_3d_pla", name: "3D tisk — PLA (hodinová sazba)", price: 250 },
    { id: "p_3d_petg", name: "3D tisk — PETG (hodinová sazba)", price: 300 },
    { id: "p_3d_tpu", name: "3D tisk — TPU (hodinová sazba)", price: 350 },
  ],
  print3d: [],
  // Opakující se lekce – šablony
  recurringTemplates: [],
  // Balíčky (definice + přiřazení studentům)
  packageDefs: [
    { id: "pk_10", name: "Balíček 10 lekcí", lessons: 10, price: 4000, validityDays: 180 },
    { id: "pk_5", name: "Balíček 5 lekcí", lessons: 5, price: 2100, validityDays: 90 },
  ],
  studentPackages: [], // { id, studentId, packageDefId, lessonsTotal, lessonsUsed, purchasedAt, expiresAt, price }
});

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return migrate({ ...defaultState(), ...parsed });
  } catch (e) {
    console.warn("Store load failed, using default", e);
    return defaultState();
  }
}

function migrate(state) {
  if (state.students) {
    state.students = state.students.map((s) => ({
      ...s,
      notes: Array.isArray(s.notes) ? s.notes : [],
      publicToken: s.publicToken || null,
    }));
  }
  if (state.invoices) {
    state.invoices = state.invoices.map((inv) => ({ ...inv, payments: Array.isArray(inv.payments) ? inv.payments : [] }));
  }
  if (!state.recurringTemplates) state.recurringTemplates = [];
  if (!state.packageDefs) state.packageDefs = defaultState().packageDefs;
  if (!state.studentPackages) state.studentPackages = [];
  if (!state.settings.workingHours) state.settings.workingHours = defaultState().settings.workingHours;
  state.version = SCHEMA_VERSION;
  return state;
}

let state = loadState();

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("Nepodařilo se uložit data.", "danger"); }
}

/* ============================================================
   3. TÉMA
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = $("#btnTheme");
  if (btn) btn.textContent = theme === "dark" ? "🌙" : "☀️";
  state.theme = theme;
  saveState();

function toast(msg, type = "ok", ms = 3000) {
  const wrap = $("#toastWrap");
  if (!wrap) return;
  const t = el("div", { class: `toast ${type}` }, msg);
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateX(20px)"; setTimeout(() => t.remove(), 200); }, ms);
}

function openModal({ title, body, footer, size = "" }) {
  const backdrop = $("#modalBackdrop");
  const modal = $("#modal");
  if (!backdrop || !modal) return;
  $("#modalTitle").textContent = title || "";
  const bodyEl = $("#modalBody");
  const footEl = $("#modalFooter");
  bodyEl.innerHTML = "";
  footEl.innerHTML = "";
  if (typeof body === "string") bodyEl.innerHTML = body;
  else if (body instanceof Node) bodyEl.appendChild(body);
  if (Array.isArray(footer)) footer.forEach((n) => footEl.appendChild(n));
  else if (footer instanceof Node) footEl.appendChild(footer);
  modal.className = `modal ${size}`.trim();
  backdrop.classList.add("open");
}

function currentRoute() {
  const hash = location.hash.replace(/^#\//, "").split("?")[0];

function navigate() {
  const route = currentRoute();
  const conf = ROUTES[route];
  $("#pageTitle").textContent = conf.title;
  $$("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === route));

/* ============================================================
   7. POMOCNÉ – PLATBY & BALÍČKY
   ============================================================ */
function invoicePaidTotal(inv) { return (inv.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0); }
function invoiceRemaining(inv) { return Math.max(0, (Number(inv.total) || 0) - invoicePaidTotal(inv)); }
function invoiceEffectiveStatus(inv) {
  const paid = invoicePaidTotal(inv);
  const total = Number(inv.total) || 0;
  if (paid >= total && total > 0) return "paid";
  if (paid > 0) return "partial";
  if (inv.dueDate && inv.dueDate < todayISO()) return "overdue";
  return "issued";
}

function activePackagesFor(studentId) {
  const now = todayISO();
  return state.studentPackages.filter((p) =>
    p.studentId === studentId &&
    p.lessonsUsed < p.lessonsTotal &&
    (!p.expiresAt || p.expiresAt >= now)
  );
}
function totalAvailableLessons(studentId) {
  return activePackagesFor(studentId).reduce((sum, p) => sum + (p.lessonsTotal - p.lessonsUsed), 0);
}
function consumeLessonFromPackage(studentId) {
  const list = activePackagesFor(studentId).sort((a, b) => (a.expiresAt || "9999").localeCompare(b.expiresAt || "9999"));
  if (!list.length) return false;
  list[0].lessonsUsed += 1;
  return true;
}

/* ============================================================
   8. SMART ALERTS (funkce 4)
   ============================================================ */
function buildAlerts() {
  const alerts = [];
  const now = todayISO();
  const monthPrefix = now.slice(0, 7);

  // 1) Neomluvené lekce (3+ v řadě)
  const byStudent = {};
  state.lessons.forEach((l) => {
    if (!byStudent[l.studentId]) byStudent[l.studentId] = [];
    byStudent[l.studentId].push(l);
  });
  Object.entries(byStudent).forEach(([sid, lessons]) => {
    const sorted = lessons.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    let streak = 0;
    for (const l of sorted) {
      if (l.status === "absent") streak++;
      else if (l.status === "canceled") continue;
      else break;
    }
    if (streak >= 3) {
      const st = state.students.find((s) => s.id === sid);
      if (st) alerts.push({
        type: "danger",
        title: `${st.firstName} ${st.lastName} – ${streak}× neomluveno v řadě`,
        desc: "Zvažte kontaktování rodičů.",
        action: () => openStudentDetail(sid),
        actionLabel: "Otevřít profil",
      });
    }
  });

  // 2) Faktury po splatnosti
  state.invoices.forEach((inv) => {
    const eff = invoiceEffectiveStatus(inv);
    if (eff === "overdue") {
      const days = Math.floor((new Date(now) - new Date(inv.dueDate)) / 86400000);
      const st = state.students.find((s) => s.id === inv.studentId);
      alerts.push({
        type: "danger",
        title: `Faktura ${inv.number} – ${days} dní po splatnosti`,
        desc: `${st ? st.firstName + " " + st.lastName : "Volný odběratel"} · zbývá ${fmtCZK(invoiceRemaining(inv))}`,
        action: () => openInvoiceDetail(inv.id),
        actionLabel: "Detail",
      });
    }
  });

  // 3) Studenti s 0 lekcemi v tomto měsíci (a aspoň 1 lekcí celkem)
  state.students.forEach((st) => {
    const allLessons = state.lessons.filter((l) => l.studentId === st.id);
    if (!allLessons.length) return;
    const thisMonth = allLessons.filter((l) => (l.date || "").startsWith(monthPrefix));
    if (thisMonth.length === 0) {
      alerts.push({
        type: "info",
        title: `${st.firstName} ${st.lastName} – 0 lekcí v tomto měsíci`,
        desc: "Možná ukončil výuku, nebo je potřeba naplánovat.",
        action: () => openStudentDetail(st.id),
        actionLabel: "Profil",
      });
    }
  });

  // 4) Balíčky s nízkým zůstatkem (1-2 lekce)
  state.students.forEach((st) => {
    const remaining = totalAvailableLessons(st.id);
    if (remaining === 1 || remaining === 2) {
      alerts.push({
        type: "warn",
        title: `${st.firstName} ${st.lastName} – zbývají ${remaining} lekce`,
        desc: "Čas nabídnout nový balíček.",
        action: () => openPackagePurchase(st.id),
        actionLabel: "Prodat balíček",
      });
    }
  });

  // 5) Zítřejší lekce bez potvrzení (status canceled)
  const tomorrow = addDays(now, 1);
  const tomorrowLessons = state.lessons.filter((l) => l.date === tomorrow && l.status === "canceled");
  if (tomorrowLessons.length) {
    alerts.push({
      type: "warn",
      title: `Zítra ${tomorrowLessons.length} zrušených lekcí`,
      desc: "Zkontrolujte, zda jsou náhrady domluvené.",
    });
  }

  // 6) GDPR chybějící u nezletilých
  state.students.forEach((st) => {
    const age = calcAge(st.birthDate);
    if (age !== null && age < 18 && (!st.guardian?.name || !st.gdprConsent)) {
      alerts.push({
        type: "danger",
        title: `GDPR chybí – ${st.firstName} ${st.lastName}`,
        desc: "Nezletilý bez zákonného zástupce nebo souhlasu.",
        action: () => openStudentForm(st.id),
        actionLabel: "Doplnit",
      });
    }
  });

  return alerts;
}

function statusBadge(status) {
  const map = {
    present:  ["ok", "Přítomen"],
    excused:  ["warn", "Omluven"],
    absent:   ["danger", "Neomluven"],
    canceled: ["muted", "Zrušeno"],
    paid:     ["ok", "Zaplaceno"],
    partial:  ["warn", "Částečně"],
    issued:   ["info", "Vystavena"],
    overdue:  ["danger", "Po splatnosti"],
    planned:  ["info", "Naplánováno"],
  };
  const [cls, label] = map[status] || ["muted", status || "—"];
  return el("span", { class: `badge ${cls}` }, label);
}

function openStudentForm(id = null) {
  const editing = id ? state.students.find((s) => s.id === id) : null;
  const s = editing || {
    id: uid("stu"), firstName: "", lastName: "", birthDate: "", email: "", phone: "",
    address: "", level: "Začátečník", notes: [], guardian: { name: "", relation: "", phone: "", email: "" },
    gdprConsent: false,
  };

  const form = el("form", { id: "studentForm" });
  const field = (label, inputEl, hint = "") => {
    const f = el("div", { class: "field" }, el("label", {}, label), inputEl);
    if (hint) f.appendChild(el("div", { class: "hint" }, hint));
    f.appendChild(el("div", { class: "err-msg" }, "Toto pole je povinné."));
    return f;
  };
  const inp = (name, value, type = "text", required = false) =>
    el("input", { name, type, value: value ?? "", required: required ? "required" : null });

  form.append(
    el("div", { class: "form-row" },
      field("Jméno *", inp("firstName", s.firstName, "text", true)),
      field("Příjmení *", inp("lastName", s.lastName, "text", true))
    ),
    el("div", { class: "form-row" },
      field("Datum narození *", inp("birthDate", s.birthDate, "date", true), "Věk se vypočítá automaticky."),
      field("Úroveň", el("select", { name: "level" },
        ...["Začátečník", "Mírně pokročilý", "Pokročilý", "Expert"].map((lv) =>
          el("option", { value: lv, selected: s.level === lv ? "selected" : null }, lv)
        )
      ))
    ),
    el("div", { class: "form-row" },
      field("E-mail", inp("email", s.email, "email")),
      field("Telefon", inp("phone", s.phone, "tel"))
    ),
    el("div", { class: "form-row full" }, field("Adresa", inp("address", s.address)))
  );

  const guardianBox = el("div", { class: "card", style: "margin-top:14px;background:var(--bg-3)" });
  guardianBox.appendChild(el("h3", {}, "Zákonný zástupce (povinné pro nezletilé)"));
  const gName = inp("guardianName", s.guardian?.name);
  const gRel  = inp("guardianRelation", s.guardian?.relation);
  const gPhone= inp("guardianPhone", s.guardian?.phone, "tel");
  const gEmail= inp("guardianEmail", s.guardian?.email, "email");
  const gdprCb = el("input", { type: "checkbox", name: "gdprConsent", checked: s.gdprConsent ? "checked" : null });
  const gdprWrap = el("label", { style: "display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-dim);margin-top:12px;cursor:pointer" },
    gdprCb, "Souhlasím se zpracováním osobních údajů (GDPR) *"
  );
  const ageHint = el("div", { class: "hint", style: "margin-top:8px;color:var(--warn)" });

  guardianBox.append(
    el("div", { class: "form-row" }, field("Jméno zástupce *", gName), field("Vztah", gRel)),
    el("div", { class: "form-row" }, field("Telefon", gPhone), field("E-mail", gEmail)),
    gdprWrap, ageHint
  );
  form.appendChild(guardianBox);

  const birthInput = form.querySelector('[name="birthDate"]');
  const updateGuardianState = () => {
    const age = calcAge(birthInput.value);
    const isMinor = age !== null && age < 18;
    guardianBox.style.display = age === null ? "none" : "block";
    ageHint.textContent = age === null ? "" :
      isMinor ? `Student má ${age} let → zákonný zástupce a GDPR souhlas jsou povinné.`
              : `Student má ${age} let → plnoletý, údaje zástupce jsou nepovinné.`;
  };
  birthInput.addEventListener("input", updateGuardianState);
  updateGuardianState();

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    $$(".field.error", form).forEach((f) => f.classList.remove("error"));
    let valid = true;
    const markErr = (name) => { form.querySelector(`[name="${name}"]`)?.closest(".field")?.classList.add("error"); valid = false; };
    if (!data.firstName.trim()) markErr("firstName");
    if (!data.lastName.trim()) markErr("lastName");
    if (!data.birthDate) markErr("birthDate");
    const age = calcAge(data.birthDate);
    const isMinor = age !== null && age < 18;
    if (isMinor) {
      if (!data.guardianName?.trim()) markErr("guardianName");
      if (!data.gdprConsent) { valid = false; toast("Pro nezletilého je nutný GDPR souhlas.", "danger"); }
    }
    if (!valid) { toast("Zkontrolujte povinná pole.", "danger"); return; }

    const payload = {
      id: s.id,
      firstName: data.firstName.trim(), lastName: data.lastName.trim(), birthDate: data.birthDate,
      email: data.email?.trim() || "", phone: data.phone?.trim() || "", address: data.address?.trim() || "",
      level: data.level || "Začátečník", notes: s.notes || [],
      publicToken: s.publicToken || null,
      guardian: {
        name: data.guardianName?.trim() || "", relation: data.guardianRelation?.trim() || "",
        phone: data.guardianPhone?.trim() || "", email: data.guardianEmail?.trim() || "",
      },
      gdprConsent: data.gdprConsent === "on",
      updatedAt: new Date().toISOString(),
    };

    if (editing) { const idx = state.students.findIndex((x) => x.id === s.id); if (idx >= 0) state.students[idx] = payload; }
    else { state.students.push({ ...payload, createdAt: new Date().toISOString() }); }
    saveState(); closeModal(); toast(editing ? "Student upraven." : "Student vytvořen.", "ok"); navigate();
  });

  openModal({
    title: editing ? "Upravit studenta" : "Nový student",
    body: form,

function openGenerateLessonsForm() {
  const activeTemplates = state.recurringTemplates.filter((t) => t.active);
  if (!activeTemplates.length) { toast("Žádné aktivní šablony.", "warn"); return; }

  const form = el("form", {});
  form.append(
    el("div", { class: "field", style: "margin-bottom:14px" },
      el("label", {}, "Generovat od"),
      el("input", { type: "date", name: "from", value: todayISO(), required: "required" })
    ),
    el("div", { class: "field", style: "margin-bottom:14px" },
      el("label", {}, "Generovat do"),
      el("input", { type: "date", name: "to", value: addDays(todayISO(), 30), required: "required" })
    ),
    el("p", { style: "color:var(--text-dim);font-size:12px" },
      `Bude použito ${activeTemplates.length} aktivních šablon. Již existující lekce ve stejný den a čas budou přeskočeny.`
    )
  );

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const from = data.from, to = data.to;
    if (from > to) { toast("Datum od musí být před datem do.", "danger"); return; }

    let created = 0, skipped = 0;
    activeTemplates.forEach((t) => {
      const start = t.startDate > from ? t.startDate : from;
      const end = t.endDate < to ? t.endDate : to;
      let d = start;
      while (d <= end) {
        if (getWeekday(d) === t.weekday) {
          // kolize?
          const exists = state.lessons.some((l) => l.date === d && l.studentId === t.studentId);
          if (!exists) {
            state.lessons.push({
              id: uid("les"), studentId: t.studentId, date: d,
              status: "planned", note: `Auto-generováno (${t.from}–${t.to})`,
              generatedFrom: t.id,
            });
            created++;
          } else skipped++;
        }
        d = addDays(d, 1);
      }
    });
    saveState();
    closeModal();
    toast(`Vygenerováno ${created} lekcí, přeskočeno ${skipped}.`, "ok", 4000);
    navigate();
  });

  openModal({
    title: "Hromadné generování lekcí",
    body: form,
    footer: [
      el("button", { type: "button", class: "btn", onclick: closeModal }, "Zrušit"),
      el("button", { type: "submit", class: "btn btn-primary", onclick: () => form.requestSubmit() }, "⚡ Vygenerovat"),
    ],
  });
}

  const descInput = el("textarea", { name: "description", placeholder: "Popis…" });

  let mediaRecorder = null, chunks = [], recordedBlob = null;
  const audioPreview = el("audio", { controls: "controls", style: "display:none" });
  const recBtn = el("button", { type: "button", class: "btn" }, "● Nahrát");
  const stopBtn = el("button", { type: "button", class: "btn btn-danger", style: "display:none" }, "■ Zastavit");
  const recStatus = el("div", { class: "hint" }, "Mikrofon: nepřipraveno");
  const recorderBox = el("div", { class: "recorder" }, el("span", { class: "dot" }), recBtn, stopBtn, audioPreview);
  const recWrapper = el("div", {}, el("label", { style: "font-size:12px;font-weight:600;color:var(--text-dim);display:block;margin-bottom:6px" }, "Hlasová instrukce"), recorderBox, recStatus);

  recBtn.addEventListener("click", async () => {
    if (!navigator.mediaDevices?.getUserMedia) { toast("Nepodporováno.", "danger"); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(chunks, { type: "audio/webm" });
        audioPreview.src = URL.createObjectURL(recordedBlob);
        audioPreview.style.display = "block";
        stream.getTracks().forEach((t) => t.stop());
        recBtn.style.display = "inline-flex"; stopBtn.style.display = "none";
        recorderBox.classList.remove("recording"); recStatus.textContent = "Nahrávka připravena.";
      };
      mediaRecorder.start();
      recBtn.style.display = "none"; stopBtn.style.display = "inline-flex";
      recorderBox.classList.add("recording"); recStatus.textContent = "Nahrávání…";
    } catch (e) { toast("Nelze přistoupit k mikrofonu.", "danger"); }
  });
  stopBtn.addEventListener("click", () => { if (mediaRecorder?.state === "recording") mediaRecorder.stop(); });

  form.append(
    el("div", { class: "form-row" }, el("div", { class: "field" }, el("label", {}, "Student *"), studentSelect), el("div", { class: "field" }, el("label", {}, "Název *"), titleInput)),
    el("div", { class: "form-row full" }, el("div", { class: "field" }, el("label", {}, "Popis"), descInput)),
    recWrapper
  );

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    if (!data.studentId || !data.title?.trim()) { toast("Vyplňte studenta a název.", "danger"); return; }
    const persist = (audioDataUrl) => {
      state.homeworks.push({
        id: uid("hw"), studentId: data.studentId, title: data.title.trim(),
        description: data.description?.trim() || "", audio: audioDataUrl || "", done: false,
        createdAt: new Date().toISOString(),
      });
      saveState(); closeModal(); toast("Úkol uložen.", "ok"); navigate();
    };
    if (recordedBlob) { const r = new FileReader(); r.onload = () => persist(r.result); r.readAsDataURL(recordedBlob); }
    else persist("");
  });

  openModal({
    title: "Nový domácí úkol", body: form,
    footer: [
      el("button", { type: "button", class: "btn", onclick: closeModal }, "Zrušit"),
      el("button", { type: "submit", class: "btn btn-primary", onclick: () => form.requestSubmit() }, "Uložit"),
    ], size: "lg",
  });
}

    el("div", { style: "margin-bottom:14px;font-size:13px;color:var(--text-dim)" },

function importData() {
  const input = el("input", { type: "file", accept: ".json" });
  input.addEventListener("change", () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!confirm("Přepsat všechna data?")) return;
        state = migrate({ ...defaultState(), ...parsed });
        applyTheme(state.theme || "dark");
        saveState(); toast("Data importována.", "ok"); navigate();
      } catch (e) { toast("Neplatný JSON.", "danger"); }
    };
    reader.readAsText(file);
  });
  input.click();
}
function hardReset() {
  if (!confirm("Smazat VŠECHNA data?")) return;
  if (!confirm("Nevratné. Pokračovat?")) return;
  state = defaultState(); applyTheme("dark"); saveState(); toast("Reset.", "ok"); navigate();
}

<div class="foot">Vygenerováno ${new Date().toLocaleString("cs-CZ")} · SashaLab ERP</div>
<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ============================================================
   21. VEŘEJNÝ PORTÁL (Synchronizovaný s učitelem)
   ============================================================ */
const BADGE_DEFS = [
  { id: "first", icon: "🎸", title: "První lekce", check: s => state.lessons.filter(l => l.studentId===s.id && l.status==="present").length >= 1 },
  { id: "ten", icon: "🔟", title: "10 lekcí", check: s => state.lessons.filter(l => l.studentId===s.id && l.status==="present").length >= 10 },
  { id: "streak", icon: "🔥", title: "5× v řadě", check: s => state.lessons.filter(l => l.studentId===s.id).length >= 5 },
  { id: "hw", icon: "✎", title: "5 úkolů", check: s => state.homeworks.filter(h => h.studentId===s.id && h.done).length >= 5 }
];
function getEarnedBadges(s) { return BADGE_DEFS.filter(b => b.check(s)); }
const AI_KB = [
  { k: ["začít", "první", "nováček"], a: "Začni s akordy C, G, Am, F. Cvič přechody 5 minut denně s metronomem na 60 BPM." },
  { k: ["akord", "barré", "bar", "dur", "moll"], a: "Základní akordy: C, G, D, A, E, Am, Em. Pro barré F dur drž prst nízko za pražcem a válcuj ho." },
  { k: ["rytmus", "metronom", "tempo", "bpm"], a: "Cvič s metronomem na 60 BPM. Přesnost je důležitější než rychlost. Začni jen dolů na 4 doby." },
  { k: ["ladění", "ladička", "tuner"], a: "Standardní ladění kytary je E-A-D-G-H-E. V portálu máš ladičku s mikrofonem." },
  { k: ["cvičit", "dlouho", "denně", "hodin"], a: "Ideálně 20–30 minut denně, 5× týdně. Lepší je 20 minut denně než 2 hodiny jednou týdně." },
  { k: ["bolest", "bolí", "prsty", "ruce"], a: "Bolest prstů na začátku je normální – kůže si musí vytvořit mozoly. Pokud bolí klouby, přestaň." },
  { k: ["písnička", "píseň", "song", "hrát"], a: "Pro začátečníky doporučuji: Knockin' on Heaven's Door, Horse with No Name, Three Little Birds, Wonderwall." },
  { k: ["kapodastr", "capo"], a: "Kapodastr (capo) je umělý pražec. Když ho dáš na 2. pražec, akordy znějí o tón výš." },
  { k: ["trsátko", "pick", "prsty"], a: "Trsátko doporučuji 0,73 mm pro akordy, 0,88 mm pro sóla. Drž ho mezi palcem a ukazováčkem." },
  { k: ["stupnice", "scale", "c dur"], a: "Stupnice C dur na kytaře: začni na 3. pražci struny A. Cvič ji nahoru a dolů s metronomem na 60 BPM." },
  { k: ["odznak", "badge", "odměna"], a: "Za aktivity dostáváš odznaky! 🎸 První lekce, 10 lekcí, 5× v řadě, splněné úkoly." },
  { k: ["tabulatura", "tab", "taby"], a: "Tabulatura (TAB) je zápis pro kytaru. 6 čar = 6 strun. Čísla = pražce." },
  { k: ["úkol", "domácí", "homework"], a: "Domácí úkoly najdeš v portálu v sekci Domácí úkoly. Pokud má úkol audio nahrávku (🎙), klikni na přehrávač." }
];
function askAI(q) {
  const norm = q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const hit = AI_KB.find(i => i.k.some(k => norm.includes(k)));
  return hit ? hit.a : null;
}
function escalateQ(studentId, q) {
  const s = state.students.find(x => x.id === studentId);
  state.questions = state.questions || [];
  state.questions.push({ id: uid("q"), studentId, studentName: s.firstName + " " + s.lastName, question: q, date: new Date().toISOString(), answered: false });
  saveState();
  const sub = encodeURIComponent("Dotaz od žáka: " + s.firstName + " " + s.lastName);
  const bod = encodeURIComponent("Žák " + s.firstName + " " + s.lastName + " se zeptal:\n\n" + q + "\n\nProsím o odpověď do 24h.");
  window.open(`mailto:${state.settings.emailMain}?cc=${state.settings.emailCopy}&subject=${sub}&body=${bod}`, "_blank");
}

function renderPortal(app) {
  const hashParts = location.hash.split("/portal/");
const token = hashParts.length > 1 ? hashParts[1].split("?")[0] : null;
if (!token) {
  app.innerHTML = "<div class='empty-state' style='padding:80px 20px'><div class='icon'>🔒</div>Přístup zamítnut. Portál je dostupný pouze přes odkaz od lektora.</div>";
  return;
}
  const s = state.students.find((x) => x.publicToken && x.publicToken === token);
  if (!s) {
    app.innerHTML = "";
    app.appendChild(el("div", { class: "empty-state", style: "padding:80px 20px" }, el("div", { class: "icon" }, "🔒"), "Neplatný nebo revokovaný odkaz."));
    return;
  }
  const lessons = state.lessons.filter((l) => l.studentId === s.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const hw = state.homeworks.filter((h) => h.studentId === s.id).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const notes = s.notes || [];
  const remaining = totalAvailableLessons(s.id);
  const badges = getEarnedBadges(s);

  // Hlavička
  app.appendChild(el("div", { class: "card", style: "text-align:center" },
    el("h1", { style: "font-size:28px;margin-bottom:8px" }, `${s.firstName} ${s.lastName}`),
    el("p", { style: "color:var(--text-dim)" }, `Úroveň: ${s.level} · ${calcAge(s.birthDate)} let`),
    remaining > 0 && el("p", { style: "color:var(--ok);margin-top:8px;font-weight:600" }, `🎟 Zbývá ${remaining} lekcí z balíčku`)
  ));

  // Odznaky
  const badgeCard = el("div", { class: "card" }, el("h3", {}, `🏆 Odznaky (${badges.length} / ${BADGE_DEFS.length})`));
  const bg = el("div", { class: "badges-grid" });
  BADGE_DEFS.forEach(b => bg.appendChild(el("div", { class: `badge-card ${badges.includes(b) ? 'earned' : ''}` }, el("div", { class: "b-icon" }, b.icon), el("div", { class: "b-title" }, b.title))));
  badgeCard.appendChild(bg); app.appendChild(badgeCard);

  // Nástroje (Metronom, Ladička, AI)
  const toolsCard = el("div", { class: "card" }, el("h3", {}, "🎛 Nástroje"));
  const tabs = el("div", { class: "tool-tabs" });
  const cont = el("div", {});
  toolsCard.append(tabs, cont); app.appendChild(toolsCard);

  const tools = [
    { n: "🥁 Metronom", f: () => {
        cont.innerHTML = "";
        let bpm = 80, running = false, int = null, beat = 0;
        const ui = el("div", { class: "metronome-ui" },
          el("div", { class: "tempo-display" }, String(bpm)),
          el("div", { style: "font-size:12px;color:var(--text-dim);margin-bottom:20px" }, "BPM"),
          el("div", { class: "beat-indicator" }, ...[0,1,2,3].map(() => el("div", { class: "beat-dot" }))),
          el("button", { class: "btn btn-primary", style: "margin-top:20px", onclick: (e) => {
            running = !running;
            if(running) { e.target.textContent = "⏸ Stop"; int = setInterval(() => { const dots = $$(".beat-dot", ui); dots.forEach((d,i)=>d.classList.toggle("active", i===beat)); beat=(beat+1)%4; }, 60000/bpm); }
            else { e.target.textContent = "▶ Start"; clearInterval(int); $$(".beat-dot", ui).forEach(d=>d.classList.remove("active")); }
          }}, "▶ Start")
        );
        cont.appendChild(ui);
    }},
    { n: "🎼 Ladička", f: () => {
        cont.innerHTML = "";
        const note = el("div", { class: "note-display" }, "—");
        const status = el("div", { class: "tuner-status" }, "Zapněte mikrofon");
        const btn = el("button", { class: "btn btn-primary", onclick: async (e) => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const ctx = new AudioContext();
            const analyser = ctx.createAnalyser();
            ctx.createMediaStreamSource(stream).connect(analyser);
            e.target.textContent = "Poslouchám...";
            setInterval(() => {
              const buf = new Float32Array(analyser.fftSize);
              analyser.getFloatTimeDomainData(buf);
              let max = 0, maxI = 0;
              for(let i=1; i<buf.length/2; i++) if(buf[i] > max) { max = buf[i]; maxI = i; }
              const freq = ctx.sampleRate / maxI;
              if(freq > 60 && freq < 1000 && max > 0.01) {
                const notes = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
                const n = Math.round(12 * Math.log2(freq/440) + 69);
                note.textContent = notes[n%12];
                status.textContent = Math.round(freq) + " Hz";
                status.className = "tuner-status ok";
              }
            }, 100);
          } catch(err) { alert("Chyba mikrofonu."); }
        }}, "🎤 Zapnout mikrofon");
        cont.append(el("div", { class: "tuner-ui" }, note, status, btn));
    }},
    { n: "🤖 AI Pomocník", f: () => {
        cont.innerHTML = "";
        const chat = el("div", { class: "chat-window" }, el("div", { class: "chat-msg bot" }, `Ahoj ${s.firstName}! Jsem tvůj AI asistent. Zeptej se mě na cokoli o kytaře.`));
        const inp = el("input", { style: "flex:1;padding:10px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px", placeholder: "Napiš dotaz..." });
        const send = () => {
          const q = inp.value.trim(); if(!q) return;
          chat.appendChild(el("div", { class: "chat-msg user" }, q)); inp.value=""; chat.scrollTop = chat.scrollHeight;
          setTimeout(() => {
            const a = askAI(q);
            if(a) chat.appendChild(el("div", { class: "chat-msg bot" }, a));
            else {
              chat.appendChild(el("div", { class: "chat-msg bot" }, "Děkujeme za otázku! Předali jsme ji lektorovi. Odpovíme do 24 hodin."));
              chat.appendChild(el("div", { class: "chat-msg system" }, "Odesláno na " + state.settings.emailMain));
              escalateQ(s.id, q);
            }
            chat.scrollTop = chat.scrollHeight;
          }, 400);
        };
        inp.onkeydown = e => { if(e.key === "Enter") send(); };
        cont.append(chat, el("div", { class: "chat-input-row" }, inp, el("button", { class: "btn btn-primary", onclick: send }, "Odeslat")));
    }}
  ];

  tools.forEach((t, i) => {
    const b = el("button", { class: i===0 ? "active" : "", onclick: () => { $$("button", tabs).forEach(x=>x.classList.remove("active")); b.classList.add("active"); t.f(); } }, t.n);
    tabs.appendChild(b);
  });
  tools[0].f(); // Spustí metronom jako první

  // Docházka
  const lessCard = el("div", { class: "card" }, el("h3", {}, `Docházka (${lessons.length})`));
  if (!lessons.length) lessCard.appendChild(el("div", { class: "empty-state", style: "padding:16px" }, "Žádné lekce."));
  else {
    const t = el("table", { class: "table" });
    t.appendChild(el("thead", {}, el("tr", {}, el("th", {}, "Datum"), el("th", {}, "Stav"))));
    const tb = el("tbody");
    lessons.slice(0, 20).forEach((l) => tb.appendChild(el("tr", {}, el("td", {}, fmtDate(l.date)), el("td", {}, statusBadge(l.status)))));
    t.appendChild(tb); lessCard.appendChild(t);
  }
  app.appendChild(lessCard);

  // Úkoly
  const hwCard = el("div", { class: "card" }, el("h3", {}, `Domácí úkoly (${hw.length})`));
  if (!hw.length) hwCard.appendChild(el("div", { class: "empty-state", style: "padding:16px" }, "Žádné úkoly."));
  else hw.forEach((h) => {
    const box = el("div", { style: "padding:12px;background:var(--bg-3);border-radius:8px;margin-bottom:10px" },
      el("div", { style: "display:flex;justify-content:space-between;margin-bottom:4px" },
        el("strong", {}, h.title || "—"),
        h.done ? el("span", { class: "badge ok" }, "Splněno") : el("span", { class: "badge warn" }, "Otevřeno")
      ),
      el("div", { style: "font-size:12px;color:var(--text-dim)" }, `${fmtDate(h.createdAt)}${h.description ? " · " + h.description : ""}`)
    );
    if (h.audio) box.appendChild(el("audio", { controls: "controls", src: h.audio, style: "width:100%;margin-top:8px;height:36px" }));
    hwCard.appendChild(box);
  });
  app.appendChild(hwCard);

  // Poznámky
  const nCard = el("div", { class: "card" }, el("h3", {}, `Poznámky lektora (${notes.length})`));
  if (!notes.length) nCard.appendChild(el("div", { class: "empty-state", style: "padding:16px" }, "Žádné poznámky."));
  else {
    const tl = el("div", { class: "timeline" });
    notes.forEach((n) => tl.appendChild(el("div", { class: "timeline-item" }, el("div", { class: "meta" }, el("span", {}, fmtDateTime(n.createdAt))), el("div", { class: "text" }, n.text))));
    nCard.appendChild(tl);
  }
  app.appendChild(nCard);

  app.appendChild(el("p", { style: "text-align:center;font-size:11px;color:var(--text-muted);margin-top:24px" }, `SashaLab · O&S CreativeWorks · ${escapeHtml(state.settings.lectorName)}`));
}

/* ============================================================
   22. ROUTER ROZŠÍŘENÍ O PORTÁL
   ============================================================ */
const _origNavigate = navigate;
navigate = function() {
  const hash = location.hash;
  if (hash.startsWith("#/portal/")) {
    $("#pageTitle").textContent = "Portál studenta";
    $$("#nav a").forEach((a) => a.classList.remove("active"));
    const app = $("#app");
    app.innerHTML = "";
    try { renderPortal(app); }
    catch (e) { console.error(e); app.appendChild(el("div", { class: "empty-state" }, "Chyba.")); }
    $("#sidebar")?.classList.remove("open");
    return;
  }
  _origNavigate();
};
window.addEventListener("hashchange", navigate);
</script>
